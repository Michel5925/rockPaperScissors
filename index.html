<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="container">
        <div class="rock">
            <img class="rockimg" src="../images/rock.png" alt="A hand making a fist">
            <img class="rockimg2" src="../images/rock2.png" alt="A hand making a fist">
            <button id="rockButton"> ROCK </button>
        </div>
    
        <div class="paper">
            <img class="paperimg" src="../images/paper.png" alt="A hand with all 5 fingers out">
            <img class="paperimg2" src="../images/paper2.png" alt="A hand with all 5 fingers out">
            <button id="paperButton"> PAPER </button>
        </div>
    
        <div class="scissors">
            <img class="scissorsimg" src="../images/scissors.png" alt="A hand with 2 fingers out">
            <img class="scissorsimg2" src="../images/scissors2.png" alt="A hand with 2 fingers out">
            <button id="scissorsButton"> SCISSOR </button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
